name: forma1_tipp
description: "Formula 1 Tipping Game - Predict champions, race winners, and compete with friends."
publish_to: 'none'
version: 2.6.0+14

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.3

  # UI & Animation
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.2.0+3
  glassmorphism_ui: ^0.3.0

  # Image handling
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Audio
  audioplayers: ^6.1.0

  # Utilities
  http: ^1.2.2
  http_parser: ^4.1.1
  share_plus: ^10.1.4
  home_widget: ^0.7.0
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1
  timeago: ^3.7.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0D0D0F"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter_native_splash:
  color: "#0D0D0F"
  image: "assets/images/splash_logo.png"
  android: true
  ios: false
  android_12:
    color: "#0D0D0F"
    icon_background_color: "#0D0D0F"
    image: "assets/images/splash_logo.png"
