<html lang="hu">

<meta charset="UTF-8">

<title>F1 Tipp Mix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d1a;
  --surface:#151528;
  --card:#1a1a35;
  --cyan:#5ce1e6;
  --red:#e10600;
  --white:#f0f0f5;
  --gray:#8888aa;
}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--white);
  min-height:100vh;
  overflow-x:hidden;
}

.bg-grid{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(92,225,230,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(92,225,230,0.03) 1px,transparent 1px);
  background-size:60px 60px;
}

.glow-orb{
  position:fixed;border-radius:50%;filter:blur(120px);opacity:0.15;z-index:0;pointer-events:none;
}
.glow-1{width:500px;height:500px;background:var(--cyan);top:-150px;left:-100px;}
.glow-2{width:400px;height:400px;background:var(--red);bottom:-100px;right:-100px;}

.lang-switch{
  position:fixed;top:16px;right:16px;z-index:10;
  display:flex;gap:4px;
  background:var(--card);
  border:1px solid rgba(92,225,230,0.15);
  border-radius:10px;padding:4px;
}
.lang-btn{
  background:none;border:none;color:var(--gray);
  font-size:0.85rem;font-weight:700;
  padding:6px 14px;border-radius:8px;cursor:pointer;
  transition:all 0.2s;letter-spacing:0.5px;
}
.lang-btn.active{
  background:var(--red);color:#fff;
}
.lang-btn:hover:not(.active){color:var(--white);}

.container{
  position:relative;z-index:1;
  max-width:800px;margin:0 auto;padding:40px 24px;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;justify-content:center;gap:36px;
}

.logo-wrap{
  width:140px;height:140px;
  background:var(--card);
  border-radius:28px;
  border:2px solid rgba(92,225,230,0.2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 60px rgba(92,225,230,0.1);
  animation:float 4s ease-in-out infinite;
}
.logo-wrap img{width:110px;height:auto;filter:drop-shadow(0 0 20px rgba(92,225,230,0.3));}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

h1{
  font-size:clamp(2rem,5vw,3.2rem);
  font-weight:900;text-align:center;
  letter-spacing:-1px;line-height:1.1;
}
h1 .accent{color:var(--red);}
h1 .cyan{color:var(--cyan);}

.subtitle{
  font-size:1.1rem;color:var(--gray);text-align:center;
  max-width:500px;line-height:1.6;
}

.countdown-section{text-align:center;}
.countdown-label{
  font-size:0.85rem;text-transform:uppercase;letter-spacing:3px;
  color:var(--cyan);margin-bottom:16px;font-weight:600;
}
.countdown{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}
.cd-unit{
  background:var(--card);
  border:1px solid rgba(92,225,230,0.15);
  border-radius:16px;
  padding:20px 16px;min-width:80px;
  text-align:center;
  backdrop-filter:blur(10px);
  transition:transform 0.3s,border-color 0.3s;
}
.cd-unit:hover{transform:scale(1.05);border-color:var(--cyan);}
.cd-num{
  font-size:2.4rem;font-weight:900;
  background:linear-gradient(135deg,var(--white),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1;
}
.cd-label{
  font-size:0.7rem;text-transform:uppercase;letter-spacing:2px;
  color:var(--gray);margin-top:6px;
}

.race-info{
  display:flex;align-items:center;gap:10px;
  background:var(--card);
  border:1px solid rgba(225,6,0,0.2);
  border-radius:12px;padding:14px 24px;
  font-size:0.95rem;
}
.race-flag{font-size:1.5rem;}
.race-name{font-weight:700;}
.race-date{color:var(--gray);font-size:0.85rem;}

.download-btn{
  display:inline-flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,var(--red),#c00500);
  color:#fff;text-decoration:none;
  font-size:1.15rem;font-weight:700;
  padding:18px 40px;border-radius:16px;
  border:none;cursor:pointer;
  box-shadow:0 8px 32px rgba(225,6,0,0.3);
  transition:transform 0.2s,box-shadow 0.2s;
  letter-spacing:0.5px;
}
.download-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(225,6,0,0.4);
}
.download-btn:active{transform:translateY(0);}
.download-btn svg{width:24px;height:24px;fill:#fff;}

.download-info{
  font-size:0.8rem;color:var(--gray);text-align:center;
}

.whats-new{
  background:var(--card);
  border:1px solid rgba(92,225,230,0.12);
  border-radius:16px;padding:24px;
  width:100%;max-width:650px;
}
.whats-new-title{
  font-size:1rem;font-weight:700;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.whats-new-title span{color:var(--cyan);}
.whats-new ul{
  list-style:none;padding:0;
}
.whats-new li{
  font-size:0.88rem;color:var(--gray);
  padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);
  display:flex;align-items:center;gap:8px;
}
.whats-new li:last-child{border-bottom:none;}
.whats-new li::before{content:'';display:none;}
.wn-icon{font-size:1rem;flex-shrink:0;}

.features{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;width:100%;max-width:650px;
}
.feat{
  background:var(--card);
  border:1px solid rgba(92,225,230,0.08);
  border-radius:14px;padding:20px;
  text-align:center;
  transition:border-color 0.3s,transform 0.3s;
}
.feat:hover{border-color:rgba(92,225,230,0.25);transform:translateY(-4px);}
.feat-icon{font-size:2rem;margin-bottom:8px;}
.feat-title{font-weight:700;font-size:0.95rem;margin-bottom:4px;}
.feat-desc{font-size:0.8rem;color:var(--gray);line-height:1.4;}

.support-section{
  width:100%;max-width:650px;
  background:var(--card);
  border:1px solid rgba(92,225,230,0.12);
  border-radius:16px;padding:24px;
}
.support-title{
  font-size:1rem;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.support-title span{color:var(--red);}
.donation-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  background:rgba(255,255,255,0.03);
  border-radius:10px;
  margin-bottom:8px;
  transition:background 0.2s;
}
.donation-row:hover{background:rgba(255,255,255,0.06);}
.donation-icon{font-size:1.3rem;}
.donation-label{font-weight:700;font-size:0.9rem;min-width:70px;}
.donation-value{color:var(--cyan);font-size:0.85rem;font-family:monospace;}
.donation-copy{
  margin-left:auto;
  background:rgba(92,225,230,0.1);
  border:1px solid rgba(92,225,230,0.2);
  color:var(--cyan);border-radius:8px;
  padding:6px 12px;font-size:0.75rem;font-weight:600;
  cursor:pointer;transition:all 0.2s;
}
.donation-copy:hover{background:rgba(92,225,230,0.2);}
.github-link{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--white);text-decoration:none;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:10px 20px;
  font-weight:600;font-size:0.9rem;
  transition:all 0.2s;margin-top:8px;
}
.github-link:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);}
.github-link svg{width:20px;height:20px;fill:var(--white);}

.footer{
  font-size:0.75rem;color:var(--gray);text-align:center;
  padding-top:24px;border-top:1px solid rgba(255,255,255,0.05);
  width:100%;
}

.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{
  0%,100%{box-shadow:0 8px 32px rgba(225,6,0,0.3)}
  50%{box-shadow:0 8px 48px rgba(225,6,0,0.5)}
}

@media(max-width:480px){
  .cd-unit{min-width:65px;padding:14px 10px;}
  .cd-num{font-size:1.8rem;}
  .download-btn{padding:16px 28px;font-size:1rem;}
}
</style>

let currentLang = 'hu';

function detectLang() {
  const nav = navigator.language || navigator.userLanguage || 'en';
  return nav.toLowerCase().startsWith('hu') ? 'hu' : 'en';
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('f1tm_lang', lang);
  render();
}

function render() {
  const t = i18n[currentLang];
  document.documentElement.lang = currentLang;
  document.title = t.title;

  document.getElementById('btn-hu').classList.toggle('active', currentLang === 'hu');
  document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');

  document.getElementById('txt-subtitle').textContent = t.subtitle;
  document.getElementById('txt-countdown-label').textContent = t.countdownLabel;
  document.getElementById('lbl-days').textContent = t.days;
  document.getElementById('lbl-hours').textContent = t.hours;
  document.getElementById('lbl-mins').textContent = t.mins;
  document.getElementById('lbl-secs').textContent = t.secs;
  document.getElementById('txt-race-name').textContent = t.raceName;
  document.getElementById('txt-race-date').textContent = t.raceDate;
  document.getElementById('txt-download').textContent = t.download;
  document.getElementById('txt-dl-info').textContent = t.dlInfo;
  document.getElementById('txt-whats-new-title').textContent = t.whatsNewTitle;
  document.getElementById('txt-footer').innerHTML = t.footer;
  document.getElementById('txt-support-title').textContent = t.supportTitle;
  document.getElementById('txt-support-desc').textContent = t.supportDesc;
  document.getElementById('txt-github').textContent = t.github;
  document.getElementById('btn-copy-rev').textContent = t.copied ? 'Copy' : 'Copy';
  document.getElementById('btn-copy-btc').textContent = t.copied ? 'Copy' : 'Copy';

  const wnList = document.getElementById('whats-new-list');
  wnList.innerHTML = t.whatsNew.map(item =>
    `<li><span class="wn-icon">${item.icon}</span>${item.text}</li>`
  ).join('');

  const featGrid = document.getElementById('features-grid');
  featGrid.innerHTML = t.features.map(f =>
    `<div class="feat">
      <div class="feat-icon">${f.icon}</div>
      <div class="feat-title">${f.title}</div>
      <div class="feat-desc">${f.desc}</div>
    </div>`
  ).join('');
}

const saved = localStorage.getItem('f1tm_lang');
currentLang = saved || detectLang();
render();

const TARGET = new Date('2026-03-08T05:00:00Z');

function updateCountdown() {
  const t = i18n[currentLang];
  const now = new Date();
  let diff = TARGET - now;

  if (diff <= 0) {
    document.getElementById('cd-days').textContent = '0';
    document.getElementById('cd-hours').textContent = '0';
    document.getElementById('cd-mins').textContent = '0';
    document.getElementById('cd-secs').textContent = '0';
    document.getElementById('txt-countdown-label').textContent = t.countdownDone;
    return;
  }

  const d = Math.floor(diff / 86400000); diff %= 86400000;
  const h = Math.floor(diff / 3600000);  diff %= 3600000;
  const m = Math.floor(diff / 60000);    diff %= 60000;
  const s = Math.floor(diff / 1000);

  document.getElementById('cd-days').textContent = d;
  document.getElementById('cd-hours').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-mins').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-secs').textContent = String(s).padStart(2,'0');
}

updateCountdown();
setInterval(updateCountdown, 1000);

function copyText(text, label) {
  navigator.clipboard.writeText(text).then(() => {
    const t = i18n[currentLang];
    const msg = t.copied || 'Copied!';
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--cyan);color:var(--cyan);padding:10px 24px;border-radius:10px;font-size:0.9rem;font-weight:600;z-index:100;';
    el.textContent = label + ' ' + msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  });
}
</script>
